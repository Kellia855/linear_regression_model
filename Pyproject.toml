description = "Diabetes glucose-level regression model, API, and Flutter client (course summative)."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.1",
    "pydantic>=2.7.4",
    "scikit-learn>=1.5.0",
    "pandas>=2.2.2",
    "numpy>=1.26.4",
    "joblib>=1.4.2",
    "python-multipart>=0.0.9",
    "matplotlib>=3.9.0",
    "seaborn>=0.13.2",
    "jupyter>=1.0.0",
    "ipykernel>=7.3.0",
]

[tool.uv]
package = false
